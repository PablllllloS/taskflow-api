name: Testes da API

on:
  push:
    branches:  [main]
  pull_request:
    branches:  [main]

jobs:
  testes-api:
    runs-on:  ubuntu-latest

    #Variáveis dos testes (os segredos vem do cofre)
    env:
      DATABASE_URL:  ${{secrets.DATABASE_URL}}
      DIRECT_URL:  ${{secrets.DIRECT_URL}}
      JWT_SECRET:  ${{secrets.JWT_SECRET}}
      AMBIENTE:  teste

    steps:
      -  name:  baixar o código
         uses:  action/checkout@v6

      -  name: Instalar o Node
         uses: actions/setup-node@6
         with:
           node-version:  22
           cache:  npm

      -  name:  Instalar as dependências
         run: npm ci

      -  name: Rodar os testes
         run: npm test